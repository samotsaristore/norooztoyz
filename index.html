<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Norooz Toyz</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#3B5674;
    color:white;
}

/* HEADER GINAWANG STICKY GAYA NG HYPEBEAST PERO ORIGINAL NA KULAY */
header{
    background:#3B5674;
    padding:10px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:3px solid orange;
    position: sticky;
    top: 0;
    z-index: 1000;
}

.logo{
    display:flex;
    align-items:center;
    gap:15px;
    color:white;
    font-size:22px;
    font-weight:bold;
}

.logo img{
    width:60px !important;
    height:60px !important;
    object-fit:contain;
}

/* DESKTOP MENU LAYOUT */
nav{
    display:flex;
    align-items:center;
    gap:18px;
}

nav a{
    color:white;
    text-decoration:none;
    transition:.3s;
    white-space:nowrap;
}

nav a:hover{
    color:orange;
}

/* HAMBURGER BUTTON (Nakatago sa Desktop) */
.menu-toggle {
    display: none;
    flex-direction: column;
    gap: 5px;
    background: none;
    border: none;
    cursor: pointer;
    padding: 5px;
}

.menu-toggle span {
    display: block;
    width: 25px;
    height: 3px;
    background-color: white;
    transition: 0.3s;
}

.hero{
    text-align:center;
    padding:20px;
}

.hero h1{
    font-size:60px;
    color:orange;
}

.hero p{
    margin-top:20px;
    font-size:22px;
    color:#cccccc;
}

.button{
    display:inline-block;
    margin-top:40px;
    background:orange;
    color:black;
    text-decoration:none;
    padding:15px 40px;
    border-radius:8px;
    font-weight:bold;
}

footer{
    text-align:center;
    padding:30px;
    background:#111;
    margin-top:100px;
    border-top:1px solid #333;
}


/* ABOUT */
#about{
    padding:80px 40px;
    background:#45627F;
    text-align:center;
}

#about h2{
    font-size:42px;
    color:orange;
    margin-bottom:30px;
}

#about p{
    max-width:900px;
    margin:20px auto;
    font-size:20px;
    line-height:1.8;
}


/* HYPEBEAST-STYLE MOBILE MENU LAYOUT */
@media (max-width:992px){

header{
    padding:15px 20px;
}

/* Lalabas ang Hamburger Button sa Mobile */
.menu-toggle {
    display: flex; 
}

/* Itatago ang orihinal na nakalatag na menu; magiging Dropdown Menu */
nav{
    display: none;
    flex-direction: column;
    position: absolute;
    top: 100%;
    left: 0;
    width: 100%;
    background:#3B5674; /* Orixinal na kulay */
    padding: 10px 0;
    gap: 0;
    border-bottom: 3px solid orange;
    box-shadow: 0 8px 16px rgba(0,0,0,0.3);
}

/* Aktibo kapag pinindot ang ☰ button */
nav.active {
    display: flex;
}

nav a{
    width: 100%;
    text-align: left;
    padding: 15px 25px; /* Malaking touch area para sa mobile browsing */
    font-size: 18px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
}

nav a:last-child {
    border-bottom: none;
}

/* Animasyon para maging X ang Hamburger Icon kapag bukas */
.menu-toggle.active span:nth-child(1) {
    transform: rotate(45deg) translate(5px, 6px);
}
.menu-toggle.active span:nth-child(2) {
    opacity: 0;
}
.menu-toggle.active span:nth-child(3) {
    transform: rotate(-45deg) translate(5px, -6px);
}

.logo{
    flex-direction: row; /* Pinanatiling horizontal para sa malinis na header link */
    text-align: left;
}

.logo img{
    width:55px !important;
    height:55px !important;
}

.hero{
    padding:40px 20px;
}

.hero h1{
    font-size:30px;
    line-height:1.2;
}

.hero p{
    font-size:18px;
}

.button{
    display: block;
    width:100%;
    max-width:260px;
    margin: 40px auto 0 auto;
    text-align:center;
}

}

</style>

</head>


<body>


<header>

<div class="logo">
    <img src="images/norooztoyzlogo.png" alt="Norooz Toyz Logo">
    <span>NOROOZ TOYZ</span>
</div>

<!-- HAMBURGER MENU BUTTON -->
<button class="menu-toggle" id="mobile-menu-btn" aria-label="Toggle navigation">
    <span></span>
    <span></span>
    <span></span>
</button>

<!-- NAVIGATION LINKS -->
<nav id="nav-menu">
    <a href="#">Home</a>
    <a href="shop.html">Shop</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
    <a href="https://shopee.ph" target="_blank">🛒 Shopee</a>
    <a href="https://lazada.com.ph" target="_blank">🛍️ Lazada</a>
    <a href="https://facebook.com" target="_blank">📘 Facebook</a>
</nav>

</header>



<section class="hero">
    <h1>Welcome to Norooz Toyz</h1>
    <p>
    Your One-Stop Shop for Affordable Toys, Electronic Gadgets, Apparel, and More
    </p>
    <a class="button" href="#">COMING SOON</a>
</section>



<footer>
    © 2026 Norooz Toyz
</footer>

<!-- SCRIPT PARA SA PAGBUKAS AT PAGSARA NG MENU -->
<script>
    const menuBtn = document.getElementById('mobile-menu-btn');
    const navMenu = document.getElementById('nav-menu');

    menuBtn.addEventListener('click', () => {
        menuBtn.classList.toggle('active');
        navMenu.classList.toggle('active');
    });
</script>

</body>
</html>
