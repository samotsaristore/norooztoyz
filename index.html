<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Norooz Toyz</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#3B5674;
    color:white;
    width: 100%;
    overflow-x: hidden; /* Iniiwasan ang pag-zoom out ng browser */
}

header{
    background:#3B5674;
    padding:15px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:3px solid orange;
}

.logo{
    display:flex;
    align-items:center;
    gap:15px;
    color:white;
    font-size:22px;
    font-weight:bold;
}

.logo img{
    width:60px !important;
    height:60px !important;
    object-fit:contain;
}

nav{
    display:flex;
    align-items:center;
    gap:18px;
}

nav a{
    color:white;
    text-decoration:none;
    transition:.3s;
    white-space:nowrap;
}

nav a:hover{
    color:orange;
}

.hero{
    text-align:center;
    padding:60px 20px;
}

.hero h1{
    font-size:60px;
    color:orange;
}

.hero p{
    margin-top:20px;
    font-size:22px;
    color:#cccccc;
}

.button{
    display:inline-block;
    margin-top:40px;
    background:orange;
    color:black;
    text-decoration:none;
    padding:15px 40px;
    border-radius:8px;
    font-weight:bold;
}

footer{
    text-align:center;
    padding:30px;
    background:#111;
    margin-top:100px;
    border-top:1px solid #333;
}


/* ABOUT - INAYOS ANG WIDTH PARA SA MOBILE SAFETY */
#about{
    padding:80px 20px;
    background:#45627F;
    text-align:center;
    width: 100%;
}

#about h2{
    font-size:42px;
    color:orange;
    margin-bottom:30px;
}

#about p{
    max-width:100%; /* Binago mula 900px para hindi mag-zoom out ang phone */
    width: 900px;
    margin:20px auto;
    font-size:20px;
    line-height:1.8;
}


/* PINALAKING MOBILE LAYOUT (Para sa Cellphone) */
@media (max-width: 992px){

header{
    flex-direction:column;
    padding:20px 10px;
}

.logo{
    flex-direction:column;
    text-align:center;
    margin-bottom:20px;
}

.logo img{
    width:75px !important; /* Pinalaki ang logo sa mobile */
    height:75px !important;
}

.logo span {
    font-size: 24px; /* Pinalaki ang pangalan ng brand */
    margin-top: 5px;
}

nav{
    display:flex;
    flex-direction: column; /* Ginawang pababa ang listahan para hindi siksikan */
    gap:12px; /* Malaking espasyo sa pagitan ng bawat menu */
    width:100%;
    padding: 0 10px;
}

nav a{
    font-size:20px; /* Mas malaking letra para madaling basahin */
    padding:18px 20px; /* Malaking-malaking touch target para sa daliri mo */
    background:rgba(255, 255, 255, 0.1); /* May background para mukhang malaking button */
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius:8px;
    display:block;
    text-align:center;
    width: 100%;
}

nav a:active{
    background:orange;
    color:black;
}

.hero{
    padding:60px 15px;
}

.hero h1{
    font-size:36px; /* Tamang laki ng headline sa phone */
    line-height:1.2;
}

.hero p{
    font-size:18px;
}

.button{
    display: block;
    width:100%;
    max-width:280px;
    padding: 18px; /* Pinalaki rin ang "Coming Soon" button */
    font-size: 18px;
    margin: 40px auto 0 auto;
    text-align:center;
}

}

</style>

</head>


<body>


<header>

<div class="logo">
    <img src="images/norooztoyzlogo.png" alt="Norooz Toyz Logo">
    <span>NOROOZ TOYZ</span>
</div>


<nav>
    <a href="#">Home</a>
    <a href="shop.html">Shop</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
    <a href="https://shopee.ph" target="_blank">🛒 Shopee</a>
    <a href="https://lazada.com.ph" target="_blank">🛍️ Lazada</a>
    <a href="https://facebook.com" target="_blank">📘 Facebook</a>
</nav>


</header>



<section class="hero">
    <h1>Welcome to Norooz Toyz</h1>
    <p>
    Your One-Stop Shop for Affordable Toys, Electronic Gadgets, Apparel, and More
    </p>
    <a class="button" href="#">COMING SOON</a>
</section>



<footer>
    © 2026 Norooz Toyz
</footer>


</body>
</html>
