<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Norooz Toyz</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#3B5674;
    color:white;
}

header{
    background:#3B5674;
    padding:10px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:3px solid orange;
}

.logo{
    display:flex;
    align-items:center;
    gap:15px;
    color:white;
    font-size:22px;
    font-weight:bold;
}

.logo img{
    width:60px !important;
    height:60px !important;
    object-fit:contain;
}

nav{
    display:flex;
    align-items:center;
    gap:18px;
}

nav a{
    color:white;
    text-decoration:none;
    transition:.3s;
    white-space:nowrap;
}

nav a:hover{
    color:orange;
}

.hero{
    text-align:center;
    padding:20px;
}

.hero h1{
    font-size:60px;
    color:orange;
}

.hero p{
    margin-top:20px;
    font-size:22px;
    color:#cccccc;
}

.button{
    display:inline-block;
    margin-top:40px;
    background:orange;
    color:black;
    text-decoration:none;
    padding:15px 40px;
    border-radius:8px;
    font-weight:bold;
}

footer{
    text-align:center;
    padding:30px;
    background:#111;
    margin-top:100px;
    border-top:1px solid #333;
}


/* ABOUT SECTION */
#about{
    padding:80px 40px;
    background:#45627F;
    text-align:center;
}

#about h2{
    font-size:42px;
    color:orange;
    margin-bottom:30px;
}

#about p{
    max-width:900px;
    margin:20px auto;
    font-size:20px;
    line-height:1.8;
}


/* SAFE RESPONSIVE DESIGN (Para sa Mobile at Tablet) */
@media (max-width: 992px){

header{
    flex-direction:column;
    padding:20px 15px;
}

.logo{
    flex-direction:column;
    text-align:center;
    margin-bottom:20px;
}

.logo img{
    width:65px !important;
    height:65px !important;
}

nav{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px; /* May tamang distansya ang bawat button */
    width:100%;
}

nav a{
    font-size:16px;
    padding:12px 10px; 
    background:rgba(255, 255, 255, 0.08); /* Minimalist button border/background para madaling mapindot */
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius:6px;
    display:inline-block;
    text-align:center;
    /* Hinahati sa dalawang column ang mga buttons para malalaki at hindi siksikan */
    flex: 1 1 calc(50% - 10px); 
    min-width: 130px;
}

nav a:active{
    background:orange;
    color:black;
}

.hero{
    padding:60px 20px;
}

.hero h1{
    font-size:34px;
    line-height:1.3;
}

.hero p{
    font-size:18px;
}

.button{
    display: block;
    width:100%;
    max-width:280px;
    margin:40px auto 0 auto; /* Naka-center na sa mobile screen */
    text-align:center;
}

}

</style>

</head>


<body>


<header>

<div class="logo">
    <img src="images/norooztoyzlogo.png" alt="Norooz Toyz Logo">
    <span>NOROOZ TOYZ</span>
</div>


<nav>
    <a href="#">Home</a>
    <a href="shop.html">Shop</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
    <a href="https://shopee.ph/samotsari.store" target="_blank">🛒 Shopee</a>
    <a href="https://www.lazada.com.ph/shop/samotsaristore" target="_blank">🛍️ Lazada</a>
    <a href="https://www.facebook.com/norooz.toyz" target="_blank">📘 Facebook</a>
</nav>


</header>



<section class="hero">
    <h1>Welcome to Norooz Toyz</h1>
    <p>
    Your One-Stop Shop for Affordable Toys, Electronic Gadgets, Apparel, and More
    </p>
    <a class="button" href="#">COMING SOON</a>
</section>



<footer>
    © 2026 Norooz Toyz
</footer>


</body>
</html>
