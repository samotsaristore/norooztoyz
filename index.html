<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Norooz Toyz</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#3B5674;
    color:white;
    width: 100%;
}

/* STICKY HEADER GAYA NG HYPEBEAST */
header{
    background:#3B5674;
    padding:15px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:3px solid orange;
    position: sticky;
    top: 0;
    z-index: 1000;
}

.logo{
    display:flex;
    align-items:center;
    gap:15px;
    color:white;
    font-size:22px;
    font-weight:bold;
}

.logo img{
    width:60px !important;
    height:60px !important;
    object-fit:contain;
}

/* DESKTOP NAV */
nav{
    display:flex;
    align-items:center;
    gap:18px;
}

nav a{
    color:white;
    text-decoration:none;
    transition:.3s;
    white-space:nowrap;
}

nav a:hover{
    color:orange;
}

/* HAMBURGER TOGGLE BUTTON (Nakatago sa desktop) */
.menu-toggle {
    display: none;
    flex-direction: column;
    gap: 6px;
    background: none;
    border: none;
    cursor: pointer;
    padding: 10px;
}

.menu-toggle span {
    display: block;
    width: 30px;
    height: 4px;
    background-color: white;
    border-radius: 2px;
    transition: 0.3s;
}

.hero{
    text-align:center;
    padding:80px 20px;
}

.hero h1{
    font-size:60px;
    color:orange;
}

.hero p{
    margin-top:20px;
    font-size:22px;
    color:#cccccc;
}

.button{
    display:inline-block;
    margin-top:40px;
    background:orange;
    color:black;
    text-decoration:none;
    padding:15px 40px;
    border-radius:8px;
    font-weight:bold;
}

footer{
    text-align:center;
    padding:30px;
    background:#111;
    margin-top:100px;
    border-top:1px solid #333;
}

/* MOBILE VIEW - KOPYANG-KOPYA SA HYPEBEAST BROWSING */
@media (max-width: 992px){

    header{
        padding: 15px 20px;
    }

    /* Lumabas na ang malaking hamburger icon */
    .menu-toggle {
        display: flex;
    }

    /* Itatago ang menu, lalabas lang kapag pinindot ang ☰ */
    nav{
        display: none;
        flex-direction: column;
        position: absolute;
        top: 100%;
        left: 0;
        width: 100%;
        background:#3B5674;
        padding: 15px 0;
        gap: 0;
        border-bottom: 4px solid orange;
        box-shadow: 0 10px 20px rgba(0,0,0,0.4);
    }

    /* Kakalat sa buong lapad ng mobile kapag active */
    nav.active {
        display: flex;
    }

    /* NAPAKALAKING MENU LINKS PARA MADALING PINDUTIN SA PHONE */
    nav a{
        width: 100%;
        text-align: left;
        padding: 22px 30px; /* Sobrang laki ng touch target para sa daliri mo */
        font-size: 24px;    /* Pinalaking sukat ng letra */
        font-weight: bold;
        border-bottom: 1px solid rgba(255,255,255,0.1);
        display: block;
    }

    nav a:last-child {
        border-bottom: none;
    }

    nav a:active {
        background: rgba(255,255,255,0.1);
        color: orange;
    }

    /* Animasyon kapag pinindot ang hamburger menu button (magiging 'X') */
    .menu-toggle.active span:nth-child(1) {
        transform: rotate(45deg) translate(6px, 7px);
    }
    .menu-toggle.active span:nth-child(2) {
        opacity: 0;
    }
    .menu-toggle.active span:nth-child(3) {
        transform: rotate(-45deg) translate(6px, -8px);
    }

    /* HERO PINALAKI PARA MAGANDA TIGNAN SA CP */
    .hero{
        padding: 100px 20px;
    }

    .hero h1{
        font-size: 42px; /* Mas malaki at litaw */
        line-height: 1.2;
    }

    .hero p{
        font-size: 20px;
        margin-top: 15px;
    }

    .button{
        display: block;
        width: 100%;
        max-width: 300px;
        padding: 20px;
        font-size: 20px;
        margin: 50px auto 0 auto;
    }
}

</style>

</head>


<body>


<header>

<div class="logo">
    <img src="images/norooztoyzlogo.png" alt="Norooz Toyz Logo">
    <span>NOROOZ TOYZ</span>
</div>

<!-- HAMBURGER MENU BUTTON -->
<button class="menu-toggle" id="mobile-menu-btn" aria-label="Toggle navigation">
    <span></span>
    <span></span>
    <span></span>
</button>

<!-- NAVIGATION LINKS (Nakatago ngayon sa mobile, bubukas gamit ang script sa baba) -->
<nav id="nav-menu">
    <a href="#">Home</a>
    <a href="shop.html">Shop</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
    <a href="https://shopee.ph" target="_blank">🛒 Shopee</a>
    <a href="https://lazada.com.ph" target="_blank">🛍️ Lazada</a>
    <a href="https://facebook.com" target="_blank">📘 Facebook</a>
</nav>

</header>



<section class="hero">
    <h1>Welcome to Norooz Toyz</h1>
    <p>
    Your One-Stop Shop for Affordable Toys, Electronic Gadgets, Apparel, and More
    </p>
    <a class="button" href="#">COMING SOON</a>
</section>



<footer>
    © 2026 Norooz Toyz
</footer>

<!-- SCRIPT PARA GUMANA ANG OPEN/CLOSE MENU -->
<script>
    const menuBtn = document.getElementById('mobile-menu-btn');
    const navMenu = document.getElementById('nav-menu');

    menuBtn.addEventListener('click', () => {
        menuBtn.classList.toggle('active');
        navMenu.classList.toggle('active');
    });
</script>

</body>
</html>
